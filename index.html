<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کار در ترکیه یا عراق</title>
    <meta name="description" content="کار در ترکیه یا عراق">

    <!-- فونت وزیرمتن -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;

            min-height: 100vh;

            overflow: hidden;

            position: relative;

            background-color: #111;

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }


        /* =========================
           بخش بالایی
           ========================= */

        .half {
            position: fixed;

            right: 0;
            left: 0;

            cursor: pointer;

            z-index: 10;

            transition: background 0.3s ease;
        }


        .half-top {

            top: 0;

            height: 50vh;

            background: rgba(0, 0, 0, 0.08);
        }


        .half-top:hover {

            background: rgba(227, 10, 23, 0.15);
        }


        .half-top:active {

            background: rgba(227, 10, 23, 0.25);
        }


        /* =========================
           بخش پایینی
           ========================= */

        .half-bottom {

            bottom: 0;

            height: 50vh;

            background: rgba(0, 0, 0, 0.08);
        }


        .half-bottom:hover {

            background: rgba(0, 122, 61, 0.15);
        }


        .half-bottom:active {

            background: rgba(0, 122, 61, 0.25);
        }


        /* =========================
           خط وسط
           ========================= */

        .divider-line {

            position: fixed;

            top: 50%;

            right: 0;
            left: 0;

            height: 1px;

            background: rgba(255,255,255,0.25);

            z-index: 20;

            pointer-events: none;
        }

    </style>

</head>


<body>


    <!-- بخش ترکیه -->

    <div
        class="half half-top"
        id="turkeyHalf">
    </div>


    <!-- خط وسط -->

    <div class="divider-line"></div>


    <!-- بخش عراق -->

    <div
        class="half half-bottom"
        id="iraqHalf">
    </div>


    <script>


        /* =====================================================
           لیست احتمالی بک‌گراندها

           لازم نیست همه این فایل‌ها وجود داشته باشند.

           برنامه خودش بررسی می‌کند کدام فایل واقعاً وجود دارد.
           ===================================================== */

        const backgrounds = [

            'b1.png',
            'b2.png',
            'b3.png',
            'b4.png',
            'b5.png',
            'b6.png',
            'b7.png',
            'b8.png',
            'b9.png',
            'b10.png'

        ];


        /* =====================================================
           بررسی وجود واقعی عکس
           ===================================================== */

        function imageExists(filename) {

            return new Promise(function(resolve) {

                const image = new Image();

                image.onload = function() {

                    resolve(filename);

                };

                image.onerror = function() {

                    resolve(null);

                };

                /*
                 جلوگیری از استفاده از کش
                */

                image.src =
                    filename +
                    '?check=' +
                    Date.now();

            });

        }


        /* =====================================================
           پیدا کردن تمام عکس‌هایی که واقعاً وجود دارند
           ===================================================== */

        async function findAvailableBackgrounds() {

            const results = await Promise.all(

                backgrounds.map(function(filename) {

                    return imageExists(filename);

                })

            );


            /*
             فقط فایل‌هایی که وجود دارند نگه داشته می‌شوند
            */

            return results.filter(function(filename) {

                return filename !== null;

            });

        }


        /* =====================================================
           انتخاب تصادفی بک‌گراند
           ===================================================== */

        async function applyRandomBackground() {


            const availableBackgrounds =
                await findAvailableBackgrounds();


            /*
             اگر هیچ عکسی پیدا نشد
            */

            if (availableBackgrounds.length === 0) {

                console.log(
                    'هیچ بک‌گراندی پیدا نشد.'
                );

                return;

            }


            /*
             انتخاب تصادفی فقط از بین
             عکس‌های موجود
            */

            const randomIndex =
                Math.floor(
                    Math.random() *
                    availableBackgrounds.length
                );


            const selectedBackground =
                availableBackgrounds[randomIndex];


            /*
             قرار دادن بک‌گراند
             
             پارامتر زمان برای جلوگیری از کش
            */

            document.body.style.backgroundImage =
                "url('" +
                selectedBackground +
                "?v=" +
                Date.now() +
                "')";


            console.log(
                'بک‌گراند انتخاب شد:',
                selectedBackground
            );

        }


        /* =====================================================
           اجرای انتخاب بک‌گراند
           ===================================================== */

        applyRandomBackground();


        /* =====================================================
           رفتن به صفحه ترکیه
           ===================================================== */

        document
            .getElementById('turkeyHalf')
            .addEventListener('click', function() {

                window.location.href =
                    'turkey.html';

            });


        /* =====================================================
           رفتن به صفحه عراق
           ===================================================== */

        document
            .getElementById('iraqHalf')
            .addEventListener('click', function() {

                window.location.href =
                    'iraq.html';

            });


    </script>


</body>

</html>
