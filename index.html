<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>کار در ترکیه یا عراق</title>
    <meta name="description" content="کار در ترکیه یا عراق">
    
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .half {
            position: fixed;
            right: 0;
            left: 0;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s ease;
        }

        .half-top {
            top: 0;
            height: 50vh;
            background: rgba(0, 0, 0, 0.08);
        }

        .half-top:hover {
            background: rgba(227, 10, 23, 0.15);
        }

        .half-top:active {
            background: rgba(227, 10, 23, 0.25);
        }

        .half-bottom {
            bottom: 0;
            height: 50vh;
            background: rgba(0, 0, 0, 0.08);
        }

        .half-bottom:hover {
            background: rgba(0, 122, 61, 0.15);
        }

        .half-bottom:active {
            background: rgba(0, 122, 61, 0.25);
        }

        .divider-line {
            position: fixed;
            top: 50%;
            right: 0;
            left: 0;
            height: 1px;
            background: rgba(255,255,255,0.20);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="half half-top" id="turkeyHalf"></div>
    <div class="divider-line"></div>
    <div class="half half-bottom" id="iraqHalf"></div>

    <script>
        // ============ آرایه بک‌گراندها ============
        const backgrounds = [
            'b1.png',
            'b2.png',
            'b3.png',
            'b4.png',
            'b5.png',
            'b6.png',
            'b7.png',
            'b8.png',
            'b9.png',
            'b10.png'
        ];

        const validBackgrounds = backgrounds.filter(bg => bg.trim() !== '');

        // ============ انتخاب رندوم بک‌گراند ============
        function getRandomBackground() {
            const savedBg = sessionStorage.getItem('selectedBackground');
            
            if (savedBg) {
                return savedBg;
            }
            
            const randomIndex = Math.floor(Math.random() * validBackgrounds.length);
            const selected = validBackgrounds[randomIndex];
            
            sessionStorage.setItem('selectedBackground', selected);
            
            return selected;
        }

        function applyBackground() {
            const bg = getRandomBackground();
            document.body.style.backgroundImage = `url('${bg}')`;
        }

        applyBackground();

        // ============ رفتن به صفحات ============
        document.getElementById('turkeyHalf').addEventListener('click', function() {
            history.replaceState(null, '', 'turkey.html');
            window.location.href = 'turkey.html';
        });

        document.getElementById('iraqHalf').addEventListener('click', function() {
            history.replaceState(null, '', 'iraq.html');
            window.location.href = 'iraq.html';
        });

        // ============ رفتار Back ============
        history.pushState(null, '', window.location.href);

        window.addEventListener('popstate', function() {
            window.close();
            
            setTimeout(function() {
                window.location.replace('about:blank');
            }, 200);
        });
    </script>

</body>
</html>
